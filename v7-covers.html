<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet the Team, Option 7: Magazine covers | OOTB Pottery</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
body{margin:0;background:#fff;color:#121212;font-family:"Space Mono",ui-monospace,monospace}

/* ===== Section: a newsstand of OOTB magazine covers, one per person ===== */
.mag-sec{--blue:#1E54A3;padding:60px 16px 72px;background:#f4f1ec;overflow:hidden}
.mag-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 30px;max-width:1160px;margin:0 auto 34px;border-bottom:3px solid #121212;padding-bottom:16px}
.mag-head h2{margin:0;font:900 clamp(40px,8vw,84px)/.86 "League Spartan",sans-serif;letter-spacing:-.03em;text-transform:uppercase}
.mag-head h2 span{color:var(--blue)}
.mag-head p{margin:0;max-width:300px;font-size:13px;line-height:1.6;color:#4e4a44}

.stand{max-width:1160px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 24px}
.cover{all:unset;box-sizing:border-box;position:relative;display:block;width:100%;aspect-ratio:3/4;cursor:pointer;overflow:hidden;border-radius:4px;
  background:var(--bg);color:var(--fg);box-shadow:0 2px 0 rgba(0,0,0,.08),0 18px 30px rgba(30,30,30,.18);transition:transform .35s cubic-bezier(.3,1.4,.5,1),box-shadow .3s}
.cover:hover,.cover:focus-visible{transform:translateY(-8px) rotate(-1deg);box-shadow:0 2px 0 rgba(0,0,0,.08),0 30px 44px rgba(30,30,30,.25)}
.cover:focus-visible{outline:3px solid #121212;outline-offset:4px}
/* masthead sits BEHIND the cover star, like a real magazine */
.cover .mast{position:absolute;left:0;right:0;top:4%;text-align:center;font:900 clamp(84px,11vw,118px)/.8 "League Spartan",sans-serif;letter-spacing:-.05em;color:var(--mast);z-index:0}
.cover .issue{position:absolute;left:6%;right:6%;top:2.2%;display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;text-transform:uppercase;z-index:2;opacity:.85}
.cover .star{position:absolute;left:4%;right:4%;top:15%;bottom:4%;z-index:1;display:flex;align-items:flex-end;justify-content:center}
.cover .star img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3));transition:transform .4s}
.cover:hover .star img{transform:scale(1.04)}
.cover .star .ini{font:900 170px/1 "League Spartan",sans-serif;color:var(--mast);opacity:.6;margin-bottom:22%}
.cover .lines{position:absolute;left:6%;top:30%;z-index:2;max-width:46%;list-style:none;margin:0;padding:0}
.cover .lines li{font:800 15px/1.05 "League Spartan",sans-serif;text-transform:uppercase;margin:0 0 10px;text-shadow:0 1px 8px var(--bg)}
.cover .lines li:first-child{font-size:12px;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.08em}
.cover .name{position:absolute;left:6%;right:6%;bottom:5%;z-index:2}
.cover .name small{display:inline-block;background:var(--fg);color:var(--bg);font:700 10px "Space Mono",monospace;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px}
.cover .name b{display:block;font:900 46px/.9 "League Spartan",sans-serif;letter-spacing:-.03em;text-transform:uppercase;text-shadow:0 2px 14px var(--bg)}
/* special guest sticker: the pet, round, in the corner */
.guest{all:unset;position:absolute;right:5%;top:30%;z-index:3;width:30%;aspect-ratio:1;border-radius:50%;cursor:pointer;
  background:#ffd666;box-shadow:0 6px 14px rgba(0,0,0,.25);display:grid;place-items:center;transform:rotate(10deg);transition:transform .3s}
.guest img{width:78%;height:78%;object-fit:contain;margin-top:-6%}
.guest span{position:absolute;bottom:9%;left:0;right:0;text-align:center;font:800 9px/1.1 "League Spartan",sans-serif;text-transform:uppercase;color:#121212}
.guest:hover,.guest:focus-visible{transform:rotate(0) scale(1.1)}
.guest:focus-visible{outline:3px solid #121212;outline-offset:3px}
.cell{position:relative}
.mag-foot{max-width:1160px;margin:34px auto 0;font-size:12px;color:#6b665e;text-align:right}
@media (max-width:600px){
  .stand{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:6px 16px 20px;gap:16px;scrollbar-width:none}
  .stand::-webkit-scrollbar{display:none}
  .cell{scroll-snap-align:center}
  .cover .mast{font-size:25vw}
  .mag-foot{text-align:center}
}
</style>
</head>
<body>

<section class="mag-sec" aria-label="Meet the OOTB team">
  <header class="mag-head">
    <h2>The <span>OOTB</span><br>issue</h2>
    <p>Every one of us gets a cover. Pets get a sticker. Tap a cover to read the story.</p>
  </header>
  <div class="stand" id="stand"></div>
  <p class="mag-foot">Covers with a letter are still at the printer.</p>
</section>

<script src="team.js"></script>
<script>
versionNav('v7-covers.html');
/* background, text, masthead colour per issue */
const THEMES = [["#1E54A3","#fff","#3f74c4"],["#ffd666","#121212","#ffffff"],["#f3c6cf","#121212","#ffffff"],["#121212","#fff","#1E54A3"],
  ["#c9dcf4","#121212","#1E54A3"],["#e8673c","#fff","#ffb08d"],["#9cc5b0","#121212","#ffffff"],["#f4f1ec","#121212","#1E54A3"]];
const open = teamPopup({ photoBg: m => { const t = THEMES[people().indexOf(TEAM.find(p => p.name === (m.with || m.name))) % THEMES.length]; return t[0]; } });
document.getElementById('stand').innerHTML = people().map((m, n) => {
  const [bg, fg, mast] = THEMES[n % THEMES.length], pets = petsOf(m);
  const lines = [m.role, ...m.tags].slice(0, 4);
  return `<div class="cell">
    <button class="cover" type="button" data-i="${idx(m)}" aria-label="Meet ${m.name}, ${m.role}" style="--bg:${bg};--fg:${fg};--mast:${mast}">
      <span class="issue"><span>Issue ${String(n + 1).padStart(2, '0')}</span><span>Leslieville · Markham</span></span>
      <span class="mast" aria-hidden="true">OOTB</span>
      <span class="star">${photo(m) ? `<img src="${photo(m)}" alt="" loading="lazy">` : `<span class="ini">${m.name[0]}</span>`}</span>
      <ul class="lines">${lines.map(l => `<li>${l}</li>`).join('')}</ul>
      <span class="name"><small>Cover story</small><b>${m.name}</b></span>
    </button>
    ${pets.map(p => `<button class="guest" type="button" data-i="${idx(p)}" aria-label="Meet ${p.name}, ${p.role}">
      <img src="${photo(p)}" alt="" loading="lazy"><span>Special guest<br>${p.name}</span></button>`).join('')}
  </div>`;
}).join('');
document.querySelectorAll('.cover,.guest').forEach(b => b.onclick = () => open(+b.dataset.i, b));
</script>
</body>
</html>
