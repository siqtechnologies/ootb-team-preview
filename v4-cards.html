<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet the Team, Option 4: Crew cards | OOTB Pottery</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;800&family=Space+Mono:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
body{margin:0;background:#fff;color:#121212;font-family:"Roboto Mono",ui-monospace,monospace}

/* ===== Section: cobalt table, the team dealt as a fanned hand of collectible cards ===== */
.cards-sec{--blue:#1E54A3;position:relative;overflow:hidden;padding:64px 16px 40px;color:#fff;
  background:radial-gradient(80% 70% at 50% 100%,#2c66bd,transparent 70%),#163f7d}
.cards-sec::before{content:"";position:absolute;inset:0;background:url(img/bg.webp) center/cover;mix-blend-mode:soft-light;opacity:.55;pointer-events:none}
.cards-head{position:relative;text-align:center;max-width:680px;margin:0 auto}
.cards-head .kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#bcd3f3}
.cards-head h2{margin:10px 0 8px;font:800 clamp(38px,8vw,76px)/.92 "Space Mono",monospace;letter-spacing:-.02em}
.cards-head h2 span{color:#ffd666}
.cards-head p{margin:0;font-size:14px;color:#d6e4f7}

.hand{position:relative;height:540px;max-width:1100px;margin:10px auto 0}
.card{all:unset;box-sizing:border-box;position:absolute;left:50%;top:60px;width:190px;height:270px;margin-left:-95px;cursor:pointer;
  transform-origin:50% 320%;transform:rotate(var(--a)) translateY(0);transition:transform .35s cubic-bezier(.3,1.4,.5,1);z-index:var(--z)}
.card:hover,.card:focus-visible{transform:rotate(var(--a)) translateY(-70px) scale(1.08);z-index:20}
.card:focus-visible .face{outline:3px solid #ffd666;outline-offset:3px}

/* card front, also used big in the popup */
.face{position:relative;display:block;width:100%;height:100%;border-radius:16px;overflow:hidden;padding:9px;box-sizing:border-box;
  background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 18px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.35);
  transform:perspective(700px) rotateX(var(--ry,0deg)) rotateY(var(--rx,0deg));transition:transform .15s}
.face .win{position:absolute;inset:9px 9px 52px;border-radius:10px;background:#c9dcf4 url(img/bg.webp) center/cover;overflow:hidden}
.face .win img{position:absolute;inset:6% 4% 0;width:92%;height:94%;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.face .win .ini{position:absolute;inset:0;display:grid;place-items:center;font:800 90px "Space Mono",monospace;color:var(--c2);opacity:.5}
.face .no{position:absolute;top:16px;left:16px;z-index:1;font:700 10px "Space Mono",monospace;background:#fff;color:#163f7d;border-radius:20px;padding:2px 8px}
.face .nm{position:absolute;left:14px;right:14px;bottom:10px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.face .nm b{display:block;font:800 22px/1 "Space Mono",monospace;letter-spacing:-.01em}
.face .nm small{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
/* foil shine that follows the pointer */
.face::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--mx,50%) var(--my,30%),rgba(255,255,255,.55),transparent 40%),
    linear-gradient(115deg,transparent 30%,rgba(255,214,102,.35) 45%,rgba(140,220,255,.35) 55%,transparent 70%)}
.card:hover .face::after,.big:hover .face::after{opacity:1}

/* popup: front of the card on the left, the back (bio) on the right */
.deal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(10,24,48,.72)}
.deal.open{display:grid;animation:tm-fade .2s}
.pair{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:stretch;width:min(900px,100%);max-height:calc(100vh - 32px)}
.big{width:min(340px,42vw);aspect-ratio:19/27;animation:dealIn .5s cubic-bezier(.2,1.2,.4,1)}
.big .face .nm b{font-size:32px}.big .face .nm small{font-size:11px}.big .face .win{bottom:64px}
.back{position:relative;border-radius:18px;background:#fff;color:#121212;padding:34px 32px 26px;display:flex;flex-direction:column;overflow:auto;
  box-shadow:0 18px 40px rgba(0,0,0,.35);animation:flipIn .6s .1s both cubic-bezier(.3,1.2,.5,1);transform-origin:left center}
.back .role{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--blue,#1E54A3);margin:0 0 4px}
.back h3{margin:0 0 14px;font:800 44px/1 "Space Mono",monospace;letter-spacing:-.02em}
.back .tags{display:flex;flex-wrap:wrap;gap:4px 0;margin:0 0 16px;padding:0;list-style:none;font-size:13px;color:#1E54A3}
.back .tags li+li::before{content:"/";margin:0 10px;color:#b5b5b5}
.back .bio{margin:0;font-size:15px;line-height:1.7}
.back .nav{margin-top:auto;padding-top:22px;display:flex;justify-content:space-between;gap:10px}
.back button{font:inherit;cursor:pointer;border:1.5px solid #1E54A3;color:#1E54A3;background:#fff;border-radius:30px;padding:8px 16px}
.back .nav button{border:0;padding:6px 0}.back .nav button:hover{color:#1E54A3;text-decoration:underline;text-underline-offset:4px}
.back .x{position:absolute;top:14px;right:14px;width:40px;height:40px;padding:0;font-size:20px;line-height:1;z-index:1}
@keyframes dealIn{from{transform:translateY(60px) rotate(-8deg);opacity:0}}
@keyframes flipIn{from{transform:perspective(900px) rotateY(-90deg);opacity:0}}
.cards-foot{position:relative;text-align:center;margin:10px 0 0;font-size:12px;color:#bcd3f3}

@media (max-width:1180px) and (min-width:761px){.hand{transform:scale(.78);transform-origin:50% 0;height:440px}}
@media (max-width:760px){
  .cards-sec::before{display:none}
  .face::after{display:none}
  .hand{height:auto;display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:40px 24px 30px;margin:0 -16px;scrollbar-width:none}
  .hand::-webkit-scrollbar{display:none}
  .card{position:relative;left:auto;bottom:auto;margin:0;flex:0 0 190px;transform:none;scroll-snap-align:center}
  .card:hover,.card:focus-visible{transform:translateY(-10px)}
  .pair{grid-template-columns:1fr;overflow:auto}
  .big{width:min(260px,70vw);justify-self:center}
}
.cards-head h2{font-family:"Space Mono",monospace;font-weight:700;letter-spacing:-.03em;text-transform:none;font-size:clamp(32px,6vw,52px)}
.face .nm b{letter-spacing:-.03em}
</style>
</head>
<body>

<section class="cards-sec" aria-label="Meet the OOTB team">
  <header class="cards-head">
    <h2>Meet the team</h2>
    <p>Click on anyone to get to know them.</p>
  </header>
  <div class="hand" id="hand"></div>
</section>

<div class="deal" id="deal" role="dialog" aria-modal="true" aria-labelledby="d-name">
  <div class="pair">
    <div class="big" id="d-front"></div>
    <article class="back">
      <button class="x" id="d-x" aria-label="Close">×</button>
      <p class="role" id="d-role"></p>
      <h3 id="d-name"></h3>
      <ul class="tags" id="d-tags"></ul>
      <p class="bio" id="d-bio"></p>
      <div class="nav"><button id="d-prev">← Previous</button><button id="d-next">Next →</button></div>
    </article>
  </div>
</div>

<script src="team.js"></script>
<script>
versionNav('v4-cards.html');
/* frame colours, one glaze per card */
const FRAMES = [["#ffd666","#e39b2d"],["#f3a6b8","#d0607e"],["#8fd3b6","#3f9a7a"],["#ffb38a","#e0603a"],["#9fc3ff","#3f74c4"],
  ["#c9b3ff","#7b5cd6"],["#ffe08a","#c9a227"],["#a7e3f0","#3fa0bd"],["#d9b48c","#8a5a33"],["#3a3a3a","#121212"],["#c6c6c6","#7a7a7a"]];
const face = (m, i, big) => {
  const [c1, c2] = FRAMES[i % FRAMES.length];
  return `<span class="face" style="--c1:${c1};--c2:${c2}">
    <span class="win">${photo(m) ? `<img src="${big ? photo(m) : thumb(m)}" alt="" loading="lazy">` : `<span class="ini">${m.name[0]}</span>`}</span>
    <span class="nm"><b>${m.name}</b><small>${m.role}</small></span></span>`;
};
/* tilt + shine follow the pointer */
function shine(el){
  el.addEventListener('pointermove', e => {
    const f = el.querySelector('.face'), r = f.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    f.style.setProperty('--mx', x * 100 + '%'); f.style.setProperty('--my', y * 100 + '%');
    f.style.setProperty('--rx', (x - .5) * 16 + 'deg'); f.style.setProperty('--ry', (.5 - y) * 16 + 'deg');
  });
  el.addEventListener('pointerleave', () => { const f = el.querySelector('.face'); f.style.setProperty('--rx', '0deg'); f.style.setProperty('--ry', '0deg'); });
}

const hand = document.getElementById('hand'), n = TEAM.length, spread = 76;
TEAM.forEach((m, i) => {
  const b = document.createElement('button');
  b.className = 'card'; b.type = 'button'; b.setAttribute('aria-label', `Meet ${m.name}, ${m.role}`);
  b.style.setProperty('--a', (-spread / 2 + spread * i / (n - 1)).toFixed(1) + 'deg');
  b.style.setProperty('--z', i + 1);
  b.innerHTML = face(m, i);
  b.onclick = () => open(i, b);
  shine(b);
  hand.appendChild(b);
});

const deal = document.getElementById('deal'), $ = id => document.getElementById(id), front = $('d-front');
shine(front);
let cur = 0, opener = null;
function fill(i){
  const m = TEAM[cur = (i + n) % n];
  front.innerHTML = face(m, cur, true);
  $('d-role').textContent = m.role; $('d-name').textContent = m.name;
  $('d-tags').innerHTML = m.tags.map(t => `<li>${t}</li>`).join('');
  $('d-bio').textContent = m.bio;
  // replay the deal + flip animation for each card
  for (const el of [front, deal.querySelector('.back')]) { el.style.animation = 'none'; el.offsetHeight; el.style.animation = ''; }
}
function open(i, from){ opener = from; fill(i); deal.classList.add('open'); $('d-x').focus(); }
function close(){ deal.classList.remove('open'); opener && opener.focus(); }
$('d-x').onclick = close; $('d-prev').onclick = () => fill(cur - 1); $('d-next').onclick = () => fill(cur + 1);
deal.addEventListener('click', e => { if (e.target === deal || e.target.classList.contains('pair')) close(); });
addEventListener('keydown', e => {
  if (!deal.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowRight') fill(cur + 1);
  if (e.key === 'ArrowLeft') fill(cur - 1);
});
if (/^#open=\d+$/.test(location.hash)) open(+location.hash.slice(6));   // deep link, e.g. #open=2
</script>
</body>
</html>
