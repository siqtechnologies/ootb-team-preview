<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet the Team, Option 8: Open seats | OOTB Pottery</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
body{margin:0;background:#fff;color:#121212;font-family:"Roboto Mono",ui-monospace,monospace}
.seats-sec{--blue:#1E54A3;position:relative;overflow:hidden;padding:64px 16px 56px;color:#fff;
  background:radial-gradient(80% 70% at 50% 100%,#2c66bd,transparent 70%),#163f7d}
.seats-sec::before{content:"";position:absolute;inset:0;background:url(img/bg.webp) center/cover;mix-blend-mode:soft-light;opacity:.5;pointer-events:none}
.head{position:relative;text-align:center;max-width:640px;margin:0 auto 34px}
.head .kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#bcd3f3}
.head h2{margin:10px 0 8px;font:700 clamp(32px,6vw,56px)/1 "Space Mono",monospace;letter-spacing:-.03em}
.head h2 span{color:#ffd666}
.head p{margin:0;font-size:14px;color:#d6e4f7;line-height:1.6}

.row{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:34px 26px;max-width:1100px;margin:0 auto}
.seat{all:unset;box-sizing:border-box;position:relative;width:150px;display:flex;flex-direction:column;align-items:center;cursor:pointer;text-align:center}
.seat:focus-visible .stool{outline:3px solid #ffd666;outline-offset:4px}
.figure{position:relative;width:150px;height:170px}
.figure img{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);height:100%;width:auto;max-width:150px;object-fit:contain;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.3));transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.figure .ini{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:104px;height:140px;border-radius:52px 52px 14px 14px;
  display:grid;place-items:center;font:700 54px "Space Mono",monospace;color:#fff;background:linear-gradient(160deg,#6d9be0,#3a6dc0);opacity:.9}
.figure .pet{position:absolute;right:-18px;bottom:-4px;height:64px;width:auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.stool{position:relative;width:128px;height:34px;border-radius:50%;margin-top:-8px;
  background:radial-gradient(ellipse at 50% 30%,#e9c9a0,#c79a66 70%);box-shadow:0 14px 16px rgba(0,0,0,.28),inset 0 -5px 0 rgba(0,0,0,.12)}
.nm{margin-top:12px}
.nm b{display:block;font:700 18px/1.1 "Space Mono",monospace;letter-spacing:-.02em}
.nm small{display:block;margin-top:3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#bcd3f3}
.seat:hover .figure img,.seat:focus-visible .figure img{transform:translateX(-50%) translateY(-8px)}

/* the empty seats: dashed outline where a person would sit */
.seat.open .figure .ghost{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:104px;height:140px;border-radius:52px 52px 14px 14px;
  border:2px dashed rgba(255,255,255,.65);display:grid;place-items:center;font:400 44px "Space Mono",monospace;color:#ffd666;
  background:rgba(255,255,255,.06);transition:background .25s,transform .3s cubic-bezier(.3,1.4,.5,1)}
.seat.open:hover .ghost,.seat.open:focus-visible .ghost{background:rgba(255,214,102,.2);transform:translateX(-50%) translateY(-8px)}
.seat.open .stool{background:radial-gradient(ellipse at 50% 30%,rgba(233,201,160,.5),rgba(199,154,102,.45) 70%)}
.seat.open .nm b{color:#ffd666}
.seat.open .cta{margin-top:8px;font-size:11px;color:#fff;border-bottom:1px solid #ffd666;padding-bottom:1px;opacity:.85}
.seat.open:hover .cta{opacity:1}
.foot{position:relative;text-align:center;margin:40px 0 0;font-size:12px;color:#bcd3f3}

@media (max-width:760px){
  .row{gap:26px 14px}.seat{width:132px}.figure{width:132px;height:150px}
}
</style>
</head>
<body>
<section class="seats-sec" aria-labelledby="seats-h">
  <div class="head">
    <p class="kicker">OOTB Pottery</p>
    <h2 id="seats-h">Meet the <span>team</span></h2>
    <p>Tap a face to say hello. Tap an empty seat if you would like to sit with us.</p>
  </div>
  <div class="row" id="row"></div>
  <p class="foot">Preview only. The "Send request" button does not send anything yet.</p>
</section>

<script src="team.js"></script>
<script>
const open = teamPopup({photoBg: () => 'linear-gradient(160deg,#c9dcf4,#9dbbe8)'});
const joinSeat = joinDialog();
const row = document.getElementById('row');

row.innerHTML = people().map(m => {
  const pets = petsOf(m).map(p => `<img class="pet" src="${thumb(p)}" alt="${p.name}">`).join('');
  const fig = thumb(m) ? `<img src="${thumb(m)}" alt="">` : `<span class="ini">${m.name[0]}</span>`;
  return `<button class="seat" data-i="${idx(m)}" aria-label="${m.name}, ${m.role}">
    <span class="figure">${fig}${pets}</span><span class="stool"></span>
    <span class="nm"><b>${m.name}</b><small>${m.role}</small></span></button>`;
}).join('') + OPEN_SEATS.map((s, k) => `<button class="seat open" data-open="${k}" aria-label="Open seat: ${s.role}">
    <span class="figure"><span class="ghost">+</span></span><span class="stool"></span>
    <span class="nm"><b>${s.role}</b><small>${s.where}</small><span class="cta">Take this seat</span></span></button>`).join('');

row.addEventListener('click', e => {
  const b = e.target.closest('.seat'); if (!b) return;
  if (b.dataset.open !== undefined) joinSeat(+b.dataset.open, b); else open(+b.dataset.i, b);
});
versionNav('v8-open-seats.html');
</script>
</body>
</html>
